pause:
  fields:
    minutes:
      required: true
      default: 5
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min
    reason:
      selector:
        text:
send_summary:
simulate_detection:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: [binary_sensor, event]
    kind:
      default: person
      selector:
        select:
          options: [person, vehicle, open]
